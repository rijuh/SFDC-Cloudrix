<template>
    <section class="page-content">
        <h1>{pageName}</h1>
        <p>{pageDescription}</p>

        <template if:true={isCreateCasePage}>
            <template if:true={submitted}>
                <div class="success-message" role="status">
                    Your case was submitted successfully.
                    <lightning-button
                        label="Submit another case"
                        variant="base"
                        onclick={handleSubmitAgain}>
                    </lightning-button>
                </div>
            </template>
            <template if:false={submitted}>
                <lightning-record-edit-form
                    class="case-form"
                    object-api-name="Case"
                    onsuccess={handleSuccess}
                    onerror={handleError}>
                    <lightning-messages></lightning-messages>
                    <lightning-input-field field-name="Subject" required></lightning-input-field>
                    <lightning-input-field field-name="Description"></lightning-input-field>
                    <lightning-input-field field-name="Priority"></lightning-input-field>
                    <lightning-input-field field-name="Origin"></lightning-input-field>
                    <lightning-button
                        class="submit-button"
                        type="submit"
                        label="Submit Case"
                        variant="brand">
                    </lightning-button>
                </lightning-record-edit-form>
            </template>
        </template>
    </section>
</template>
